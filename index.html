<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon-32x32.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--SEO_META-->
    <style>
      html body {
        background: #f8f8f8;
      }
      html[data-theme='dark'] body {
        background-color: #000;
      }
      #loading-screen {
        --boot-bg: #f8f8f8;
        --boot-panel: #fff;
        --boot-border: #e5e5e5;
        --boot-fill: #e8e8e8;

        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        grid-template-columns: 64px minmax(248px, 296px) minmax(0, 1fr);
        overflow: hidden;
        min-width: 0;
        height: 100vh;
        height: 100dvh;
        background: var(--boot-bg);
      }
      html[data-theme='dark'] #loading-screen {
        --boot-bg: #000;
        --boot-panel: #0d0d0d;
        --boot-border: #262626;
        --boot-fill: #242424;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.8;
        }
      }
      .boot-rail,
      .boot-sidebar,
      .boot-chat {
        min-width: 0;
        background: var(--boot-panel);
      }
      .boot-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding-top: 16px;
        border-right: 1px solid var(--boot-border);
      }
      .boot-avatar,
      .boot-icon,
      .boot-line,
      .boot-topic,
      .boot-composer-line {
        background: var(--boot-fill);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .boot-avatar {
        width: 34px;
        height: 34px;
        border-radius: 8px;
      }
      .boot-icon {
        width: 22px;
        height: 22px;
        border-radius: 6px;
      }
      .boot-sidebar {
        padding: 18px 14px;
        border-right: 1px solid var(--boot-border);
      }
      .boot-sidebar-header,
      .boot-chat-header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .boot-sidebar-header {
        height: 38px;
        margin-bottom: 24px;
      }
      .boot-line {
        width: 112px;
        height: 12px;
        border-radius: 4px;
      }
      .boot-line-short {
        width: 72px;
      }
      .boot-topic-list {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }
      .boot-topic {
        width: 100%;
        height: 44px;
        border-radius: 6px;
      }
      .boot-topic:nth-child(2) {
        width: 82%;
      }
      .boot-topic:nth-child(3) {
        width: 68%;
      }
      .boot-chat {
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .boot-chat-header {
        flex: none;
        height: 58px;
        padding: 0 20px;
        border-bottom: 1px solid var(--boot-border);
      }
      .boot-chat-body {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px 24px 144px;
      }
      .boot-chat-body .boot-avatar {
        width: 48px;
        height: 48px;
      }
      .boot-composer {
        position: absolute;
        right: 24px;
        bottom: 24px;
        left: 24px;
        max-width: 760px;
        height: 104px;
        margin: 0 auto;
        padding: 18px;
        border: 1px solid var(--boot-border);
        border-radius: 8px;
        background: var(--boot-panel);
      }
      .boot-composer-line {
        width: 38%;
        height: 12px;
        border-radius: 4px;
      }
      @media (max-width: 767px) {
        #loading-screen {
          grid-template-columns: minmax(0, 1fr);
        }
        .boot-rail,
        .boot-sidebar {
          display: none;
        }
        .boot-composer {
          right: 12px;
          bottom: 12px;
          left: 12px;
        }
      }
    </style>
    <script>
      (function () {
        function supportsImportMaps() {
          return (
            typeof HTMLScriptElement !== 'undefined' &&
            typeof HTMLScriptElement.supports === 'function' &&
            HTMLScriptElement.supports('importmap')
          );
        }

        function supportsCascadeLayers() {
          var el = document.createElement('div');
          el.className = '__layer_test__';
          el.style.position = 'absolute';
          el.style.left = '-99999px';
          el.style.top = '-99999px';

          var style = document.createElement('style');
          style.textContent =
            '@layer a, b;' +
            '@layer a { .__layer_test__ { color: rgb(1, 2, 3); } }' +
            '@layer b { .__layer_test__ { color: rgb(4, 5, 6); } }';

          document.documentElement.append(style);
          document.documentElement.append(el);

          var color = getComputedStyle(el).color;

          el.remove();
          style.remove();

          return color === 'rgb(4, 5, 6)';
        }

        if (!(supportsImportMaps() && supportsCascadeLayers())) {
          window.location.href = '/not-compatible.html';
          return;
        }

        var theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch (_) {}
        var systemTheme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var resolvedTheme = theme === 'system' ? systemTheme : theme;
        if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', resolvedTheme);
        }

        var hl = new URLSearchParams(location.search).get('hl');
        var m = document.cookie.match(/(?:^|;\s*)LOBE_LOCALE=([^;]*)/);
        var cookie = m ? decodeURIComponent(m[1]) : '';
        var locale = hl || cookie || navigator.language || 'en-US';
        if (locale === 'auto') locale = navigator.language || 'en-US';
        if (hl && !cookie) {
          document.cookie =
            'LOBE_LOCALE=' + encodeURIComponent(hl) + ';path=/;max-age=7776000;SameSite=Lax';
        }
        document.documentElement.lang = locale;
        var rtl = ['ar', 'arc', 'dv', 'fa', 'ha', 'he', 'khw', 'ks', 'ku', 'ps', 'ur', 'yi'];
        document.documentElement.dir =
          rtl.indexOf(locale.split('-')[0].toLowerCase()) >= 0 ? 'rtl' : 'ltr';
      })();
    </script>
    <script>
      window.__SERVER_CONFIG__ = undefined; /* SERVER_CONFIG */
    </script>
    <script>
      window.__LOBE_AUTH_SESSION_PREFETCH__ = fetch('/api/auth/get-session', {
        credentials: 'include',
      }).catch(function () {
        return null;
      });
    </script>
  </head>

  <body>
    <div aria-label="Loading" id="loading-screen" role="status">
      <div class="boot-rail">
        <span class="boot-avatar"></span>
        <span class="boot-icon"></span>
        <span class="boot-icon"></span>
        <span class="boot-icon"></span>
      </div>
      <div class="boot-sidebar">
        <div class="boot-sidebar-header">
          <span class="boot-avatar"></span>
          <span class="boot-line"></span>
        </div>
        <span class="boot-line boot-line-short"></span>
        <div class="boot-topic-list">
          <span class="boot-topic"></span>
          <span class="boot-topic"></span>
          <span class="boot-topic"></span>
        </div>
      </div>
      <div class="boot-chat">
        <div class="boot-chat-header">
          <span class="boot-avatar"></span>
          <span class="boot-line"></span>
        </div>
        <div class="boot-chat-body">
          <span class="boot-avatar"></span>
          <span class="boot-line"></span>
          <span class="boot-line boot-line-short"></span>
        </div>
        <div class="boot-composer">
          <div class="boot-composer-line"></div>
        </div>
      </div>
    </div>
    <div id="root" style="height: 100%"></div>

    <!--ANALYTICS_SCRIPTS-->
    <script type="module" src="/src/spa/entry.web.tsx"></script>
  </body>
</html>
