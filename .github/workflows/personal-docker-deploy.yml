name: Personal Docker Build and Deploy

on:
  push:
    branches:
      - canary
      - main
      - 'deploy/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured server after the image is built
        required: true
        type: boolean
        default: true
      platforms:
        description: Docker target platforms
        required: true
        type: string
        default: linux/amd64

permissions:
  contents: read
  packages: write

concurrency:
  group: personal-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.image-ref.outputs.image_ref }}
      image_name: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/lobehub" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=canary,enable=${{ github.ref_name == 'canary' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'canary' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SHA=${{ github.sha }}

      - name: Resolve immutable image ref
        id: image-ref
        run: |
          echo "image_ref=${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.deploy
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/lobehub' }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
    steps:
      - name: Check deployment configuration
        id: deploy-config
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped. Configure DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY repository secrets to enable it."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout deploy files
        if: steps.deploy-config.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Upload compose bundle
        if: steps.deploy-config.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          tar -czf /tmp/lobehub-deploy.tgz -C docker-compose/deploy \
            docker-compose.yml \
            bucket.config.json \
            searxng-settings.yml

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" /tmp/lobehub-deploy.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/lobehub-deploy.tgz"

      - name: Pull image and restart
        if: steps.deploy-config.outputs.enabled == 'true'
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            GHCR_USERNAME="$GHCR_USERNAME" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            IMAGE_REF="$IMAGE_REF" \
            DEPLOY_PATH="$DEPLOY_PATH" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          mkdir -p "$DEPLOY_PATH"
          tar -xzf /tmp/lobehub-deploy.tgz -C "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          touch .env
          if grep -q '^LOBE_IMAGE=' .env; then
            sed -i.bak "s|^LOBE_IMAGE=.*|LOBE_IMAGE=${IMAGE_REF}|" .env
          else
            printf '\nLOBE_IMAGE=%s\n' "$IMAGE_REF" >> .env
          fi

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          docker compose pull lobe
          docker compose up -d
          docker image prune -f
          REMOTE
